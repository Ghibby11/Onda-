<html lang="it">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg1:#0d1020;--bg2:#1b1030;--text:#f6f7ff;--muted:rgba(246,247,255,.64);
  --glass:rgba(255,255,255,.12);--glass2:rgba(255,255,255,.22);--row:rgba(255,255,255,.07);
  --edge:rgba(255,255,255,.42);--edge2:rgba(255,255,255,.08);--shadow:rgba(0,0,0,.38);
  --h:250;--c1:hsl(250 85% 55%);--c2:hsl(310 85% 60%);--c3:hsl(200 90% 58%);--cover:none;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg1:#e4e9ff;--bg2:#f6e8ff;--text:#14162b;--muted:rgba(20,22,43,.62);
    --glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.78);--row:rgba(255,255,255,.5);
    --edge:rgba(255,255,255,.95);--edge2:rgba(255,255,255,.55);--shadow:rgba(60,50,120,.25);color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:Roboto,system-ui,sans-serif;color:var(--text);background:linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;transition:background 1.2s;animation:drift 24s ease-in-out infinite alternate}
.o1{width:60vmax;height:60vmax;left:-22vmax;top:-20vmax;background:var(--c1)}
.o2{width:48vmax;height:48vmax;right:-18vmax;top:30vh;background:var(--c2);animation-duration:30s;animation-delay:-9s}
.o3{width:44vmax;height:44vmax;left:6vw;bottom:-24vmax;background:var(--c3);animation-duration:27s;animation-delay:-15s}
@keyframes drift{to{transform:translate(7vmax,-4vmax) scale(1.12)}}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(22px) saturate(1.9) brightness(1.06);-webkit-backdrop-filter:blur(22px) saturate(1.9) brightness(1.06);
  border:1px solid var(--edge2);box-shadow:inset 1.5px 1.5px 0 var(--edge),inset -1px -1px 0 var(--edge2),inset 0 0 20px rgba(255,255,255,.08),0 14px 32px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,0) 40%,rgba(255,255,255,0) 68%,rgba(255,255,255,.12))}
.cbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.cbtn:active,.mini button:active,.ctrl button:active{transform:scale(.9)}

main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 0 200px}
.page{display:none}
.page.on{display:block;animation:pin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(14px) scale(.99)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.sec{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
h2{margin:0;font-size:19px;font-weight:700}
.pill{padding:8px 18px;border-radius:999px;border:1.5px solid var(--edge);font-weight:500;font-size:14px}
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 6px;scrollbar-width:none}
.hero::-webkit-scrollbar{display:none}
.card{flex:0 0 min(76vw,290px);height:min(98vw,380px);scroll-snap-align:center;border-radius:36px;position:relative;overflow:hidden;text-align:left;background-size:cover;background-position:center;box-shadow:inset 1.5px 1.5px 0 var(--edge),0 18px 34px var(--shadow);transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.card:active{transform:scale(.97)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.62))}
.card div{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.card b{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card i{display:block;font-style:normal;font-size:15px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:110px;font-weight:700;color:rgba(255,255,255,.4)}
.empty{margin:6px 20px;padding:34px 22px;border-radius:32px;text-align:center;color:var(--muted);line-height:1.5}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
.empty .pill{margin-top:16px;color:var(--text);background:var(--glass2)}
ul{list-style:none;margin:0;padding:0 16px;display:grid;gap:4px}
li button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 14px;background:var(--row);border-radius:10px;transition:background .25s}
li:first-child button{border-radius:26px 26px 10px 10px}
li:last-child button{border-radius:10px 10px 26px 26px}
li:only-child button{border-radius:26px}
li button:active{background:var(--glass2)}
li.cur button{background:var(--glass2);box-shadow:inset 1px 1px 0 var(--edge)}
.th{width:52px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:20px;color:rgba(255,255,255,.85);background-size:cover;background-position:center}
.lt{min-width:0;flex:1}
.lt b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt i{display:block;font-style:normal;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q{display:block;width:calc(100% - 40px);margin:0 20px 16px;background:var(--glass);border:1px solid var(--edge2);box-shadow:inset 1.5px 1.5px 0 var(--edge);border-radius:999px;padding:15px 20px;color:var(--text);font:inherit;font-size:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#q::placeholder{color:var(--muted)}
.note{padding:0 20px;color:var(--muted);font-size:15px}

.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;padding:0 16px;z-index:10}
.mini{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 8px;border-radius:999px;margin:0 6px 10px;animation:pin .5s cubic-bezier(.2,.8,.2,1)}
.mini .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.mart{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c3));background-size:cover;background-position:center;view-transition-name:art}
.open .mart{view-transition-name:none}
.mini .lt b{font-size:15px}.mini .lt i{font-size:13px}
.mini .mb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.navrow{display:flex;gap:10px;align-items:center}
.pillnav{flex:1;display:flex;gap:4px;padding:6px;border-radius:999px}
.pillnav button{flex:0 0 56px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;font-size:16px;color:var(--muted);transition:flex .45s cubic-bezier(.3,1.1,.4,1),background .3s,color .3s}
.pillnav button span{display:none}
.pillnav button.on{flex:1;background:var(--glass2);color:var(--text);box-shadow:inset 1px 1px 0 var(--edge)}
.pillnav button.on span{display:inline}
#sbtn{width:64px;height:64px}
#sbtn.on{background:var(--glass2)}

.sheet{position:fixed;inset:0;z-index:20;overflow:hidden;transform:translateY(100%);visibility:hidden;transition:transform .6s cubic-bezier(.32,.72,0,1),visibility 0s .6s;background:var(--bg1)}
.open .sheet{transform:none;visibility:visible;transition:transform .6s cubic-bezier(.32,.72,0,1),visibility 0s}
.vt .sheet{transition:none}
.sbg{position:absolute;inset:-10%;background:var(--cover) center/cover,linear-gradient(var(--c1),var(--c3));filter:blur(48px) saturate(1.4) brightness(.62);transition:background 1s}
.fcover{position:absolute;left:0;right:0;top:0;height:66%;background:radial-gradient(circle at 25% 20%,var(--c1),transparent 60%),radial-gradient(circle at 80% 85%,var(--c2),transparent 60%),var(--c3);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.open .fcover{view-transition-name:art}
.fcover.swap{animation:swap .6s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:.2;transform:scale(1.05)}}
.fcover em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:30vmin;font-weight:700;color:rgba(255,255,255,.35)}
.down{position:absolute;left:18px;top:calc(14px + env(safe-area-inset-top,0px));z-index:2}
.sbody{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;padding:0 28px calc(26px + env(safe-area-inset-bottom,0px));color:#fff}
.srow{display:flex;align-items:center;gap:14px}
.stx{flex:1;min-width:0}
.title{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:17px;opacity:.78;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fav.on{color:hsl(var(--h) 100% 80%);--hf:currentColor}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:22px 0 8px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.28) var(--p,0%));outline-offset:6px;transition:height .2s}
input[type=range]:active{height:16px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
.times{display:flex;justify-content:space-between;font-size:14px;opacity:.8;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px}
.ctrl button{width:76px;height:76px;display:grid;place-items:center;border-radius:50%;transition:transform .2s}
.ctrl .ic{width:40px;height:40px}
.ctrl #play .ic{width:56px;height:56px}
.ext{display:flex;align-items:center;gap:16px;margin-top:10px}
.ext .vol{flex:1;display:flex;align-items:center;gap:10px}
.ext .vol input{margin:0}
.ext .cbtn{width:44px;height:44px}
.ext .cbtn.on{color:hsl(var(--h) 100% 80%)}
::view-transition-group(art){animation-duration:.6s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
.drop main{outline:3px dashed var(--edge);outline-offset:-10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 5h2.5v14H4zM8.5 5H11v14H8.5zM12.8 5.9l2.4-.6 4.2 13.6-2.4.7z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.7 7.8 3.7 5 6.6 5c1.9 0 3.5 1 5.4 3 1.9-2 3.5-3 5.4-3 2.9 0 4.9 2.8 3.8 6.1-1.7 4.8-9.2 9.4-9.2 9.4z" style="fill:var(--hf,none);stroke:currentColor;stroke-width:2;stroke-linejoin:round"/></symbol>
  <symbol id="i-shuf" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.3 4.3L9.2 14.7 12.5 10.4A3 3 0 0 1 14.4 9H17V3zM3 7h4.4a3 3 0 0 1 2.4 1.2l.8 1-1.6 2-1.2-1.6A1 1 0 0 0 7.4 9H3V7zm14 8h-2.6a3 3 0 0 1-2.4-1.2l-.4-.5 1.6-2 .4.5a1 1 0 0 0 .8.2H17v-3l4 4-4 4v-3zM3 15h4.4a1 1 0 0 0 .8-.4L9 13.5l1.6 2-.8 1A3 3 0 0 1 7.4 17H3v-2z"/></symbol>

  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></symbol>
</svg>
<div class="bg" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div>
<input id="file" class="sr" type="file" accept="audio/*" multiple>

<main>
  <section class="page on" id="p-home">
    <div class="top"><h1>Onda</h1><button class="cbtn glass" id="add" aria-label="Aggiungi brani"><svg class="ic"><use href="#i-plus"/></svg></button></div>
    <div class="hero" id="hero"></div>
    <div class="sec" id="sec" hidden><h2>Aggiunti di recente</h2><button class="pill" id="all">Riproduci tutto</button></div>
    <ul id="recent"></ul>
  </section>
  <section class="page" id="p-library">
    <div class="top"><h1>Libreria</h1><span class="note" id="qc"></span></div>
    <ul id="lib"></ul>
  </section>
  <section class="page" id="p-search">
    <div class="top"><h1>Cerca</h1></div>
    <input id="q" type="search" placeholder="Brani e artisti" aria-label="Cerca">
    <ul id="res"></ul><p class="note" id="rn"></p>
  </section>
</main>

<div class="dock">
  <div class="mini glass" id="mini" hidden style="border-radius:999px">
    <button class="open" id="mopen" aria-label="Apri il player"><div class="mart" id="mart"></div><div class="lt"><b id="mt"></b><i id="ma"></i></div></button>
    <button class="mb" id="mplay" aria-label="Riproduci"><svg class="ic"><use class="pu" href="#i-play"/></svg></button>
    <button class="mb" id="mnext" aria-label="Successivo"><svg class="ic"><use href="#i-next"/></svg></button>
  </div>
  <div class="navrow">
    <nav class="pillnav glass" style="border-radius:999px" aria-label="Navigazione">
      <button data-p="home" class="on" aria-label="Home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
      <button data-p="library" aria-label="Libreria"><svg class="ic"><use href="#i-lib"/></svg><span>Libreria</span></button>
    </nav>
    <button class="cbtn glass" id="sbtn" data-p="search" aria-label="Cerca"><svg class="ic"><use href="#i-search"/></svg></button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="In riproduzione" aria-hidden="true">
  <div class="sbg"></div>
  <div class="fcover" id="fcover"><em id="ini">♪</em></div>
  <button class="cbtn glass down" id="close" aria-label="Chiudi il player"><svg class="ic"><use href="#i-down"/></svg></button>
  <div class="sbody">
    <div class="srow">
      <div class="stx"><div class="title" id="title">Nessun brano</div><div class="artist" id="artist"></div></div>
      <button class="cbtn glass" id="fav" aria-label="Preferito" aria-pressed="false"><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posizione">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button id="prev" aria-label="Precedente"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button id="play" aria-label="Riproduci"><svg class="ic"><use class="pu" href="#i-play"/></svg></button>
      <button id="next" aria-label="Successivo"><svg class="ic"><use href="#i-next"/></svg></button>
    </div>
    <div class="ext">
      <button class="cbtn glass" id="shuf" aria-label="Casuale" aria-pressed="false"><svg class="ic"><use href="#i-shuf"/></svg></button>
      <div class="vol"><svg class="ic" style="width:20px;height:20px;opacity:.8"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
      <button class="cbtn glass" id="rep" aria-label="Ripeti: no"><svg class="ic"><use href="#i-rep"/></svg></button>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)},root=document.documentElement,body=document.body;
  var a=new Audio(),tracks=[],idx=-1,shuffle=false,repeat=0;

  function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
  function fmt(t){if(!isFinite(t))return"0:00";var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function parse(f){var n=f.name.replace(/\.[^.]+$/,"").replace(/_/g," "),p=n.split(/\s+-\s+/);return p.length>1?{artist:p[0].trim(),title:p.slice(1).join(" - ").trim()}:{artist:"Artista sconosciuto",title:n.trim()}}
  function bgs(t){return t.img?"background-image:url("+t.img+")":"background:radial-gradient(circle at 25% 20%,hsl("+t.h+" 90% 68%),transparent 62%),hsl("+(t.h+40)+" 65% 38%)"}

  /* ---- copertine e colori ---- */
  function blob(u,t){return URL.createObjectURL(new Blob([u],{type:t}))}
  function findImg(b,s,e){e=Math.min(e,b.length-4);for(var i=s;i<e;i++){if(b[i]===255&&b[i+1]===216&&b[i+2]===255)return{i:i,t:"image/jpeg"};if(b[i]===137&&b[i+1]===80&&b[i+2]===78&&b[i+3]===71)return{i:i,t:"image/png"}}return null}
  async function readCover(f){
    try{
      var h=new Uint8Array(await f.slice(0,12).arrayBuffer()),b,r,p;
      if(h[0]===73&&h[1]===68&&h[2]===51){
        var n=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];b=new Uint8Array(await f.slice(0,10+n).arrayBuffer());
        var v=h[3],hl=v===2?6:10;p=10;
        while(p+hl<b.length){
          var id=String.fromCharCode(b[p],b[p+1],b[p+2],v===2?0:b[p+3]).replace(/\0/g,""),sz;
          if(v===2)sz=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];else if(v===4)sz=(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7];else sz=b[p+4]*16777216+((b[p+5]<<16)|(b[p+6]<<8)|b[p+7]);
          if(!id||sz<=0)break;
          if(id==="APIC"||id==="PIC"){r=findImg(b,p+hl,p+hl+Math.min(sz,400));if(r)return blob(b.subarray(r.i,p+hl+sz),r.t)}
          p+=hl+sz;
        }
      }else if(h[0]===102&&h[1]===76&&h[2]===97&&h[3]===67){
